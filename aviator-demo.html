<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0b0e14;color:#fff;font-family:Arial}header{background:#141822;padding:10px;display:flex;justify-content:space-between}#game{height:55vh;background:#111;position:relative;display:flex;align-items:center;justify-content:center}canvas{width:100%;height:100%;position:absolute;top:0;left:0}#mult{font-size:70px;font-weight:900;color:red;z-index:2}#plane{position:absolute;left:10%;bottom:20%;color:#0f8;z-index:3;font-weight:900}#controls{padding:15px}input{width:100%;padding:12px;background:#222;border:1px solid #333;color:#fff;border-radius:8px;margin-bottom:8px}.btn{width:100%;padding:14px;background:#0f8;border:none;border-radius:10px;font-weight:900}</style></head><body><header><a href="index.html"><- Lobby</a><div id="bal">5000</div></header><div id="game"><canvas id="c"></canvas><div id="plane">PLANE -></div><div id="mult">1.00x</div></div><div id="controls"><input id="bet" value="100" type="number"><button class="btn" id="b">BET</button></div><script>let bal=5000,bet=100,mult=1,fly=false,cr=0,iv=null,pts=[],cv=document.getElementById('c'),ctx=cv.getContext('2d');function rs(){cv.width=cv.offsetWidth*2;cv.height=cv.offsetHeight*2}rs();let m=document.getElementById('mult'),p=document.getElementById('plane'),b=document.getElementById('b'),be=document.getElementById('bet'),ba=document.getElementById('bal');b.onclick=()=>{if(fly){bal+=Math.floor(bet*mult);ba.textContent=bal;fly=false;clearInterval(iv);b.textContent='BET';return}bet=parseFloat(be.value)||100;bal-=bet;ba.textContent=bal;mult=1;fly=true;cr=Math.random()<0.3?1+Math.random():2+Math.random()*8;let bo=20,le=10;pts=[];iv=setInterval(()=>{if(!fly){clearInterval(iv);return}mult+=0.03+mult*0.02;bo+=0.5;le+=0.4;pts.push({x:le,y:bo});if(pts.length>100)pts.shift();ctx.clearRect(0,0,cv.width,cv.height);ctx.beginPath();ctx.strokeStyle='#0f8';ctx.lineWidth=4;pts.forEach((pt,i)=>{let x=(pt.x/100)*cv.width,y=(1-pt.y/100)*cv.height;if(i==0)ctx.moveTo(x,y);else ctx.lineTo(x,y)});ctx.stroke();p.style.bottom=bo+'%';p.style.left=le+'%';m.textContent=mult.toFixed(2)+'x';b.textContent='CASHOUT '+Math.floor(bet*mult);if(mult>=cr){clearInterval(iv);fly=false;m.textContent='CRASH '+cr.toFixed(2)+'x';b.textContent='BET';p.style.bottom='20%';p.style.left='10%';ctx.clearRect(0,0,cv.width,cv.height)}},60)};</script><style>#bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#0f172a;display:flex;justify-content:space-around;padding:12px;z-index:99999;border-top:1px solid #1e293b}#bottom-nav a{color:#94a3b8;text-decoration:none;padding:8px 16px;border-radius:20px}#bottom-nav a.active{color:#00ff88;background:#1e293b}#home-fix{position:fixed;top:12px;left:12px;z-index:999999;background:#00ff88;color:#000;padding:10px 18px;border-radius:20px;font-weight:900;border:none}</style><button id=home-fix onclick=window.scrollTo({top:0,behavior:"smooth"})>HOME</button><script>document.addEventListener("DOMContentLoaded",()=>{document.querySelectorAll("#bottom-nav a").forEach(a=>{a.onclick=(e)=>{e.preventDefault();window.scrollTo({top:0,behavior:"smooth"});document.querySelectorAll("#bottom-nav a").forEach(x=>x.classList.remove("active"));a.classList.add("active")}})})</script></body></html>

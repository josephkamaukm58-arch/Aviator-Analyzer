<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>JetX Demo</title>
<style>body{margin:0;background:#0a0a12;color:white;font-family:sans-serif;text-align:center}#game{width:95%;max-width:600px;margin:15px auto;background:#17172a;border-radius:12px;overflow:hidden;position:relative}canvas{width:100%;height:340px;display:block}#m{position:absolute;top:45%;left:50%;transform:translate(-50%,-50%);font-size:56px;font-weight:900;color:#e879f9;text-shadow:0 0 25px #e879f9}button{padding:15px 25px;border:none;border-radius:10px;font-weight:bold;font-size:17px;margin:8px;cursor:pointer}.bet{background:#d946ef;color:white}.cash{background:#fb923c;color:white;display:none}</style></head>
<body><h2>✈️ JETX DEMO</h2><div id="game"><canvas id="c" width="600" height="340"></canvas><div id="m">1.00x</div></div><div>Balance: KSH <b id="bal">5000</b> | <span id="st">Ready</span><br><span id="hist" style="color:#64748b;font-size:12px"></span></div><div><button class="bet" id="b">BET 50</button><button class="cash" id="ca">CASHOUT</button></div>
<script>
const cv=document.getElementById('c'),x=cv.getContext('2d');let mult=1,crash=2,fly=false,cr=false,bal=5000,bet=50,hist=[];
function getCrash(){let r=Math.random();return r<0.06?1.2+Math.random()*0.3:Math.max(1.2,(0.97/(1-r))*0.9)}function reset(){mult=1;fly=false;cr=false;document.getElementById('m').textContent='1.00x';document.getElementById('m').style.color='#e879f9';document.getElementById('st').textContent='Ready';document.getElementById('b').style.display='inline-block';document.getElementById('ca').style.display='none';draw(0)}
function draw(p){x.clearRect(0,0,600,340);x.fillStyle='#17172a';x.fillRect(0,0,600,340);x.strokeStyle='rgba(232,121,249,0.15)';for(let i=0;i<6;i++){x.beginPath();x.arc(300,400,i*70,0,Math.PI*2);x.stroke()}x.fillStyle='#e879f9';let rx=p*2.8,ry=300-p*1.2;if(fly){x.font='32px serif';x.save();x.translate(rx,ry);x.rotate(-0.2);x.fillText('🛩️',0,0);x.restore();x.strokeStyle='#a855f7';x.lineWidth=4;x.beginPath();x.moveTo(0,250);x.lineTo(rx,ry);x.stroke()}}
function go(){crash=getCrash();fly=true;cr=false;mult=1;bal-=bet;document.getElementById('bal').textContent=bal;document.getElementById('b').style.display='none';document.getElementById('ca').style.display='inline-block';let s=Date.now();(function loop(){if(cr)return;let e=(Date.now()-s)/1000;mult=Math.pow(1.1,e*2.1);if(mult>=crash){mult=crash;cr=true;fly=false;document.getElementById('m').textContent=crash.toFixed(2)+'x';document.getElementById('m').style.color='#ef4444';document.getElementById('st').textContent='CRASHED @ '+crash.toFixed(2)+'x';hist.unshift(crash.toFixed(2)+'x');if(hist.length>6)hist.pop();document.getElementById('hist').textContent=hist.join(' - ');document.getElementById('ca').style.display='none';document.getElementById('b').style.display='inline-block';setTimeout(reset,2000);return}document.getElementById('m').textContent=mult.toFixed(2)+'x';draw(mult*15);requestAnimationFrame(loop)})()}
document.getElementById('b').onclick=()=>{if(!fly)go()};document.getElementById('ca').onclick=()=>{if(!fly||cr)return;let w=Math.floor(bet*mult);bal+=w;document.getElementById('bal').textContent=bal;document.getElementById('st').textContent='Cashed @ '+mult.toFixed(2)+'x +'+w;fly=false;document.getElementById('ca').style.display='none';document.getElementById('b').style.display='inline-block'};reset();
</script></body></html>

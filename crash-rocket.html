<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>CRASH ROCKET</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0b0e14;color:#fff;font-family:sans-serif}
.header{padding:12px;background:#141822;display:flex;justify-content:space-between}
.graph{height:55vh;background:#0f1419;position:relative;overflow:hidden;border-bottom:1px solid #1f2937}
#plane{position:absolute;left:5%;bottom:15%;font-size:40px;transition:0.05s}
#mult{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:60px;font-weight:900}
.crash{color:#ff3b30!important}
.controls{padding:15px;background:#11131a}
.btn{width:100%;padding:15px;border:none;border-radius:10px;font-weight:900;font-size:16px;margin-top:10px}
.bet{background:#00ff88;color:#000}.cash{background:#ff3b30;color:#fff}
input{width:100%;padding:12px;background:#0b0e14;border:1px solid #333;border-radius:8px;color:#fff}
</style></head><body>
<div class="header"><a href="index.html" style="color:#888;text-decoration:none">← Lobby</a><b style="color:#00ff88">BAL: <span id="bal">5000</span></b></div>
<div class="graph"><div id="plane">🚀</div><div id="mult">1.00x</div></div>
<div class="controls">
<input id="betAmt" type="number" value="100"><button id="btn" onclick="action()" class="btn bet">BET - Start Round</button>
<div id="log" style="margin-top:10px;font-size:12px;color:#666;display:flex;gap:5px;overflow-x:auto"></div>
</div>
<script>
let bal=5000, playing=false, mult=1, crash=0, bet=0, iv=null;
function crashGen(){let r=Math.random(); if(r<0.08) return 1+Math.random()*0.3; return Math.max(1,(0.97/(1-r))*0.9)}
function action(){
 if(!playing){bet=parseInt(document.getElementById('betAmt').value); if(bet>bal)return alert('No balance'); bal-=bet; document.getElementById('bal').innerText=bal; playing=true; start(); document.getElementById('btn').innerText='CASHOUT '+mult.toFixed(2)+'x'; document.getElementById('btn').className='btn cash'; return;}
 let win=Math.floor(bet*mult); bal+=win; document.getElementById('bal').innerText=bal; playing=false; clearInterval(iv); alert('WIN '+win+' KSH @ '+mult.toFixed(2)+'x'); reset();
}
function start(){
 crash=crashGen(); mult=1; let st=Date.now();
 let pEl=document.getElementById('plane'), mEl=document.getElementById('mult');
 mEl.className=''; mEl.style.color='white';
 iv=setInterval(()=>{
  let e=(Date.now()-st)/1000; mult=1+e*0.4+Math.pow(e,1.8)*0.1;
  if(mult>=crash){mult=crash; mEl.innerText=mult.toFixed(2)+'x CRASHED'; mEl.className='crash'; clearInterval(iv); playing=false; document.getElementById('btn').innerText='BET - Next Round'; document.getElementById('btn').className='btn bet'; let s=document.createElement('span'); s.innerText=mult.toFixed(2)+'x'; s.style.cssText='padding:3px 8px;border-radius:10px;background:'+(mult<2?'#2a1a1a;color:#ff6b6b':mult<5?'#2a2a1a;color:#ffd93d':'#0a2a1a;color:#00ff88'); document.getElementById('log').prepend(s); setTimeout(()=>{reset()},2000); return;}
  mEl.innerText=mult.toFixed(2)+'x'; pEl.style.left=(5+Math.min(e/6,1)*75)+'%'; pEl.style.bottom=(15+Math.pow(Math.min(e/6,1),1.2)*60)+'%';
  document.getElementById('btn').innerText='CASHOUT '+mult.toFixed(2)+'x - WIN '+(bet*mult).toFixed(0);
 },60);
}
function reset(){document.getElementById('mult').innerText='1.00x'; document.getElementById('plane').style.left='5%'; document.getElementById('plane').style.bottom='15%';}
</script></body></html>
